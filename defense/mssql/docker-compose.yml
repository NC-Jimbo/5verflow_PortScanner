version: '3.8'
services:
  blue-mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: blue-mssql-1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - ./data:/var/opt/mssql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - blue-net
    restart: unless-stopped

networks:
  blue-net:
    driver: bridge