services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: service-mssql
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Password123!
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - ./mssql/data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', "bash -c ': > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql-tools18
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: Password123!
    volumes:
      - ./mssql/init.sql:/init.sql:ro
    command: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P $$MSSQL_SA_PASSWORD -Q \"IF DB_ID('CompanyConfidential') IS NULL PRINT 'INIT_REQUIRED' ELSE PRINT 'ALREADY_EXISTS'\" | grep -q INIT_REQUIRED
      && /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P $$MSSQL_SA_PASSWORD -i /init.sql
      || true
      "
    restart: 'no'

  employee-service:
    build:
      context: ./service
    container_name: employee-service
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SERVER: mssql
      MSSQL_PORT: 1433
      MSSQL_DATABASE: CompanyConfidential
      MSSQL_USER: sa
      MSSQL_PASSWORD: Password123!
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server
      MSSQL_ENCRYPT: 'no'
      MSSQL_TRUST_SERVER_CERTIFICATE: 'yes'
      SERVICE_SECRET_KEY: change-this-in-production
      SESSION_COOKIE_SECURE: 'false'
      SERVICE_ADMIN_USERNAME: admin
      SERVICE_ADMIN_PASSWORD: Admin123!
      SERVICE_ADMIN_DISPLAY_NAME: 인사팀 관리자
      SERVICE_VIEWER_USERNAME: viewer
      SERVICE_VIEWER_PASSWORD: Viewer123!
      SERVICE_VIEWER_DISPLAY_NAME: 부서 조회 사용자
      PORT: 8000
    ports:
      - '8000:8000'
