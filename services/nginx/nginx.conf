events {
    worker_connections 1024;
}

http {
    # JSON 형식 access log (Suricata eve.json 구조와 유사)
    log_format json_log escape=json
        '{"timestamp":"$time_iso8601",'
        '"event_type":"http",'
        '"src_ip":"$remote_addr",'
        '"src_port":$remote_port,'
        '"dest_port":$server_port,'
        '"http":{'
            '"method":"$request_method",'
            '"url":"$request_uri",'
            '"status":$status,'
            '"length":$body_bytes_sent,'
            '"user_agent":"$http_user_agent",'
            '"upstream":"$upstream_addr"'
        '}}';

    access_log /var/log/nginx/access.log json_log;
    error_log  /var/log/nginx/error.log warn;

    upstream user_api    { server user-api:3001; }
    upstream product_api { server product-api:3002; }
    upstream payment_api { server payment-api:3003; }

    server {
        listen 80;
        server_name _;

        # User API
        location /user/ {
            proxy_pass         http://user_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Product API
        location /product/ {
            proxy_pass         http://product_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment API
        location /payment/ {
            proxy_pass         http://payment_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Flask Dashboard
        location / {
            proxy_pass         http://flask-dashboard:5000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /healthz {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
