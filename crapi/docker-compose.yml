version: '3.8'
services:
  vulnerable-mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: blue-mssql-1433
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!     # Red Team 쉽게 뚫음
    ports:
      - "1433:1433"                        # Blue Team이 의도적으로 오픈
    volumes:version: '3.8'

services:
  crapi-web:
    image: crapi/crapi-web:latest
    container_name: crapi-web
    ports:
      - "8888:8080"
    restart: unless-stopped
    networks:
      - crapi-net

  postgresdb:
    image: postgres:13
    container_name: postgresdb
    environment:
      POSTGRES_DB: crapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crapi-net

networks:
  crapi-net:
    driver: bridge

volumes:
  postgres_data:
      - ./data:/var/opt/mssql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blue-net

networks:
  blue-net:
    driver: bridge